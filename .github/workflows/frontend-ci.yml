name: frontend-ci

# frontend/ 변경분에 한해서만 동작한다
# main 푸시는 deploy.yml 이 workflow_call 로 이 워크플로우를 호출하므로 여기서는 제외한다
on:
  push:
    branches-ignore: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend

jobs:
  lint:
    name: eslint
    runs-on: ubuntu-latest
    # 기존 코드의 린트 부채가 정리되기 전까지는 배포를 막지 않는다
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint

  build:
    name: vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          VITE_API_URL: /api
