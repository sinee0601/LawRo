name: pipeline-ci

# 추출 파이프라인과 분류 체계가 바뀌면 동작한다. API 는 호출하지 않는다
on:
  push:
    branches-ignore: [main]
    paths:
      - "pipeline/**"
      - "taxonomy/**"
      - "bench/queries.jsonl"
      - "backend/data/raw_laws/**"
      - ".github/workflows/pipeline-ci.yml"
  pull_request:
    paths:
      - "pipeline/**"
      - "taxonomy/**"
      - "bench/queries.jsonl"
      - "backend/data/raw_laws/**"
      - ".github/workflows/pipeline-ci.yml"
  workflow_dispatch:

concurrency:
  group: pipeline-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pipeline/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ruff check
        run: ruff check --config backend/ruff.toml --output-format=github pipeline

      - name: Run tests
        run: pytest pipeline/tests -q -p no:cacheprovider

      - name: Splits up to date
        run: python -m pipeline.splits --check

      # 프롬프트·taxonomy 가 바뀌었는데 test 평가가 없거나 기준선보다 나빠지면 실패
      - name: Regression gate
        run: python -m pipeline.gate
