name: backend-ci

# backend/ 변경분에 한해서만 동작한다 (frontend/, legacy/ 는 대상 아님)
# main 푸시는 deploy.yml 이 workflow_call 로 이 워크플로우를 호출하므로 여기서는 제외한다
on:
  push:
    branches-ignore: [main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:
  workflow_call:

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소한다
# (workflow_call 로 호출되면 github.workflow 가 호출자 이름이 되어 그룹이 겹치므로 접미사로 구분)
concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check --output-format=github .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # 외부 API 키 없이 도는 테스트만 포함한다 (스키마·설정·앱 조립 검증)
        run: pytest

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: lawro-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts
        run: |
          docker run --rm --entrypoint python lawro-backend:${{ github.sha }} \
            -c "import app.main; print('app import OK')"
