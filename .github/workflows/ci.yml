name: backend-ci

# backend/ 변경분에 한해서만 동작한다 (frontend/, legacy/ 는 대상 아님)
on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

# 같은 브랜치에서 새 푸시가 오면 진행 중인 실행을 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install lint tooling
        run: pip install -r requirements-dev.txt

      - name: Ruff check
        run: ruff check --output-format=github .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        # 외부 API 키 없이 도는 테스트만 포함한다 (스키마·설정·앱 조립 검증)
        run: pytest

      # [임시] 라우터 등록 실패 원인 진단용. 원인 확인 후 제거한다.
      - name: Diagnose router registration
        if: always()
        run: |
          cat > /tmp/diag.py <<'PY'
          import sys, traceback
          print("python=" + sys.version.split()[0])
          for mod in ("fastapi", "starlette", "pydantic"):
              try:
                  m = __import__(mod)
                  print(mod + "=" + str(getattr(m, "__version__", getattr(m, "VERSION", "?"))))
              except Exception as exc:
                  print(mod + " import failed: " + repr(exc))
          for name in ("auth", "chat", "contract", "worktime", "support_center"):
              try:
                  m = __import__("app.routers." + name, fromlist=["router"])
                  print("router " + name + " routes=" + str(len(m.router.routes)))
              except Exception as exc:
                  print("router " + name + " FAILED: " + repr(exc))
                  print(traceback.format_exc().replace(chr(10), " | ")[-400:])
          try:
              import app.main as main_mod
              print("app.routes=" + str(len(main_mod.app.routes)))
          except Exception as exc:
              print("app.main FAILED: " + repr(exc))
              print(traceback.format_exc().replace(chr(10), " | ")[-400:])
          PY
          PYTHONPATH=. python /tmp/diag.py > /tmp/diag.txt 2>&1 || true
          cat /tmp/diag.txt
          while IFS= read -r line; do echo "::error::$line"; done < /tmp/diag.txt

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          load: true
          tags: lawro-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image starts
        run: |
          docker run --rm --entrypoint python lawro-backend:${{ github.sha }} \
            -c "import app.main; print('app import OK')"
