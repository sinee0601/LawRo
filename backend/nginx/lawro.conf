# Nginx 설정 (Amazon Linux용)
# SSL/도메인 없이 IP로 접속할 때 사용
# SSL 적용 후에는 certbot으로 자동 업그레이드

upstream lawro_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # 최대 업로드 크기 설정 (계약서 파일)
    client_max_body_size 50M;

    # 로깅
    access_log /var/log/nginx/lawro_access.log combined;
    error_log /var/log/nginx/lawro_error.log warn;

    # API 프록시
    location / {
        proxy_pass http://lawro_backend;

        # 헤더 설정
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;

        # WebSocket 지원 (향후 필요시)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 타임아웃 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # 버퍼링
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # 헬스 체크
    location /health {
        access_log off;
        proxy_pass http://lawro_backend;
    }
}
