# LawRo backend lint configuration
# 규칙 범위는 "실제 버그를 잡는 것"에 한정한다.
#   E4/E7/E9 - import·구문·런타임 오류 계열
#   F        - 미정의 이름, 미사용 임포트/변수 (pyflakes)
#   I        - 임포트 정렬
target-version = "py311"
line-length = 120
extend-exclude = ["data", "storage"]

[lint]
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# 패키지 재노출(re-export) 목적의 임포트는 미사용으로 보지 않는다
"__init__.py" = ["F401", "F403"]
