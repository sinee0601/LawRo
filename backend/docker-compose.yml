version: '3.8'

services:
  backend:
    build: .
    container_name: lawro-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=true
    env_file:
      - .env
    volumes:
      # Mount app directory for live code updates
      - ./app:/app/app
      # Mount data directory for ChromaDB persistence
      - ./data/chroma:/app/data/chroma
      # Mount Firebase credentials (you'll need to add this file)
      - ./firebase-credentials.json:/app/firebase-credentials.json:ro
      # Mount prompts directory
      - ./prompts:/app/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: lawro-network
